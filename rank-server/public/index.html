<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="color-scheme" content="dark">
<title>HiTwo 短剧榜 · 热门 / 新剧 / 更新 / 榜单</title>
<meta name="description" content="HiTwo 短剧榜单：热门、新剧、更新三个实时维度，加上完结榜、黑马榜、礼物榜三个榜单，含封面、剧名、热度与连载进度。">
<style>
/* ================= 设计令牌 ================= */
:root{
  --bg:#0b0b10; --bg-2:#0f0f16;
  --surface:#15151d; --surface-2:#1b1b25;
  --line:#26262f; --line-soft:#1d1d26;
  --text:#f2f2f7; --text-2:#b6b6c4; --muted:#84848f;
  --accent:#ff5a7a; --accent-ink:#1a0710;
  --accent-soft:rgba(255,90,122,.13);
  --gold:#ffb648;
  --r-s:8px; --r-m:12px; --r-l:18px;
  --s1:4px; --s2:8px; --s3:12px; --s4:16px; --s5:24px; --s6:32px; --s7:48px;
  --top-h:104px;
  --ease:cubic-bezier(.22,.61,.36,1);
}
@media(min-width:768px){ :root{ --top-h:65px } }
*{margin:0;padding:0;box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{
  background:var(--bg);color:var(--text);
  font-family:system-ui,-apple-system,"PingFang SC","Hiragino Sans GB","Noto Sans SC","Microsoft YaHei",sans-serif;
  font-size:15px;line-height:1.6;-webkit-font-smoothing:antialiased;overflow-x:hidden;
}
body::before{
  content:'';position:fixed;top:0;left:0;right:0;height:54vh;pointer-events:none;z-index:0;
  background:radial-gradient(56% 60% at 50% -8%,rgba(255,90,122,.08),transparent 72%);
}

/* ================= 顶栏 ================= */
.top{
  position:sticky;top:0;z-index:40;
  background:rgba(11,11,16,.86);
  backdrop-filter:saturate(160%) blur(14px);
  -webkit-backdrop-filter:saturate(160%) blur(14px);
  border-bottom:1px solid var(--line-soft);
}
.top-in{
  max-width:1440px;margin:0 auto;padding:8px var(--s4);
  display:grid;align-items:center;gap:var(--s2) var(--s3);
  grid-template-columns:auto minmax(0,1fr);
  grid-template-areas:"brand search" "tabs tabs";
}
.brand{grid-area:brand;display:flex;align-items:baseline;gap:var(--s2);min-width:0}
.brand h1{font-size:1.04rem;font-weight:800;letter-spacing:-.02em;line-height:1.2;white-space:nowrap}
.brand h1 em{font-style:normal;color:var(--accent)}
.brand .stamp{
  display:inline-flex;align-items:center;gap:4px;
  font-size:.6rem;color:var(--muted);font-variant-numeric:tabular-nums;white-space:nowrap;
}
.brand .stamp .dot{
  width:5px;height:5px;border-radius:50%;background:var(--accent);flex:0 0 auto;
  box-shadow:0 0 6px rgba(255,90,122,.55);
}
.brand .stamp .s-lbl{display:none}
.brand .stamp .s-rel{display:none;opacity:.75}
.brand .stamp .dot.live{animation:pulse 2.4s ease-in-out infinite}
@keyframes pulse{
  0%,100%{opacity:1;box-shadow:0 0 6px rgba(255,90,122,.55)}
  50%{opacity:.4;box-shadow:0 0 12px rgba(255,90,122,.95)}
}
/* 自动更新提示 */
.toast{
  position:fixed;left:50%;top:calc(var(--top-h) + 12px);
  transform:translate(-50%,-10px);z-index:70;
  padding:7px 15px;border-radius:999px;
  background:rgba(255,90,122,.96);color:#fff;
  font-size:.76rem;font-weight:700;letter-spacing:.01em;white-space:nowrap;
  opacity:0;pointer-events:none;
  transition:opacity .3s var(--ease),transform .3s var(--ease);
  box-shadow:0 10px 28px -10px rgba(255,90,122,.75);
}
.toast.on{opacity:1;transform:translate(-50%,0)}
.search{grid-area:search;position:relative;min-width:0}
.search svg{position:absolute;left:11px;top:50%;transform:translateY(-50%);width:15px;height:15px;color:var(--muted);pointer-events:none}
.search input{
  width:100%;height:36px;padding:0 var(--s3) 0 33px;
  background:var(--surface);border:1px solid var(--line);border-radius:999px;
  color:var(--text);font-size:.84rem;font-family:inherit;outline:none;
  transition:border-color .18s var(--ease),background .18s var(--ease);
}
.search input::placeholder{color:var(--muted)}
.search input:focus{border-color:var(--accent);background:var(--surface-2)}

/* 一级导航 */
.tabs-main{grid-area:tabs;display:grid;grid-template-columns:repeat(5,1fr);gap:4px;margin-top:2px}
.tabs-main .tab{
  display:flex;flex-direction:column;align-items:center;justify-content:center;gap:0;
  height:38px;border-radius:9px;background:var(--surface);border:1px solid var(--line-soft);
  color:var(--text-2);font-size:.72rem;line-height:1.12;font-weight:600;font-family:inherit;cursor:pointer;
  white-space:nowrap;min-width:0;
  transition:background .18s var(--ease),color .18s var(--ease),border-color .18s var(--ease);
}
.tabs-main .tab i{font-style:normal;font-size:.54rem;line-height:1.1;font-weight:700;color:var(--muted);font-variant-numeric:tabular-nums}
.tabs-main .tab[aria-selected="true"]{background:var(--accent);border-color:var(--accent);color:var(--accent-ink);font-weight:800}
.tabs-main .tab[aria-selected="true"] i{color:rgba(26,7,16,.68)}

@media(min-width:768px){
  .top-in{
    padding:var(--s3) var(--s5);gap:var(--s5);
    display:flex;flex-wrap:nowrap;
  }
  .brand h1{font-size:1.32rem}
  .search{flex:1 1 200px}
  .search input{height:38px}
  .tabs-main{display:flex;gap:22px;margin-top:0;flex:0 0 auto}
  .tabs-main .tab{
    position:relative;height:auto;flex-direction:row;padding:2px 0 9px;border:0;border-radius:0;background:none;
    font-size:.93rem;color:var(--muted);gap:5px;align-items:baseline;
  }
  .tabs-main .tab i{font-size:.64rem}
  .tabs-main .tab:hover{color:var(--text-2)}
  .tabs-main .tab[aria-selected="true"]{background:none;color:var(--text);font-weight:800}
  .tabs-main .tab[aria-selected="true"] i{color:var(--accent)}
  .tabs-main .tab[aria-selected="true"]::after{
    content:'';position:absolute;left:0;right:0;bottom:-1px;height:2px;
    background:var(--accent);border-radius:2px;
  }
}
@media(min-width:768px) and (max-width:1023px){
  .top-in{gap:var(--s3)}
  .brand{flex-direction:column;align-items:flex-start;gap:1px}
  .brand h1{font-size:1.1rem}
  .tabs-main{gap:13px}
  .tabs-main .tab{font-size:.84rem}
}
@media(min-width:1024px){
  .brand .stamp{font-size:.68rem}
  .brand .stamp .s-lbl{display:inline}
  .brand .stamp .s-rel{display:inline}
}

/* ================= 二级栏（榜单） ================= */
.subbar{
  border-bottom:1px solid var(--line-soft);
  background:rgba(15,15,22,.7);
}
@media(min-width:768px){
  .subbar{position:sticky;top:var(--top-h);z-index:30;
    background:rgba(11,11,16,.9);backdrop-filter:blur(12px);-webkit-backdrop-filter:blur(12px)}
}
.subbar-in{
  max-width:1440px;margin:0 auto;padding:var(--s3) var(--s4);
  display:flex;align-items:center;gap:var(--s2);flex-wrap:wrap;
}
@media(min-width:768px){.subbar-in{padding:var(--s3) var(--s5)}}
.subtab{
  flex:0 0 auto;height:30px;padding:0 var(--s3);border-radius:999px;
  background:var(--surface);border:1px solid var(--line-soft);color:var(--text-2);
  font-size:.78rem;font-weight:600;font-family:inherit;cursor:pointer;white-space:nowrap;
  transition:all .16s var(--ease);
}
.subtab i{font-style:normal;font-size:.66rem;opacity:.6;margin-left:4px;font-variant-numeric:tabular-nums}
.subtab:hover{border-color:#34343f;color:var(--text)}
.subtab[aria-pressed="true"]{background:var(--accent-soft);border-color:var(--accent);color:var(--accent)}
.subtab[aria-pressed="true"] i{opacity:.85}
.rule{
  margin-left:auto;font-size:.7rem;color:var(--muted);line-height:1.4;
  display:flex;align-items:center;gap:6px;
}
.rule svg{width:12px;height:12px;flex:0 0 auto;opacity:.7}
@media(max-width:767px){.rule{width:100%;margin-left:0;font-size:.66rem}}

/* ================= 筛选区 ================= */
.bar{max-width:1440px;margin:0 auto;padding:var(--s3) var(--s4) 0}
@media(min-width:768px){.bar{padding:var(--s4) var(--s5) 0}}
.bar-head{display:flex;align-items:center;gap:var(--s3);margin-bottom:var(--s2);flex-wrap:wrap}
.bar-title{font-size:.68rem;font-weight:700;letter-spacing:.12em;color:var(--muted);text-transform:uppercase}
.count{font-size:.74rem;color:var(--muted);font-variant-numeric:tabular-nums}
.count b{color:var(--text);font-weight:700}
.chips{display:flex;gap:var(--s2);overflow-x:auto;padding-bottom:var(--s1);scrollbar-width:none;-ms-overflow-style:none}
.chips::-webkit-scrollbar{display:none}
.chip{
  flex:0 0 auto;height:29px;padding:0 var(--s3);border-radius:999px;
  background:var(--surface);border:1px solid var(--line-soft);color:var(--text-2);
  font-size:.76rem;font-family:inherit;cursor:pointer;white-space:nowrap;
  transition:all .16s var(--ease);
}
.chip:hover{border-color:#34343f;color:var(--text)}
.chip[aria-pressed="true"]{background:var(--accent-soft);border-color:var(--accent);color:var(--accent);font-weight:600}
.chip i{font-style:normal;opacity:.55;margin-left:5px;font-size:.7rem;font-variant-numeric:tabular-nums}

/* ================= 网格 ================= */
main{position:relative;z-index:1;padding:var(--s3) 0 var(--s7)}
.grid{
  display:grid;gap:var(--s3) var(--s2);
  grid-template-columns:repeat(3,minmax(0,1fr));
  padding:0 var(--s4);max-width:1440px;margin:0 auto;
}
@media(min-width:520px){.grid{grid-template-columns:repeat(4,minmax(0,1fr));gap:var(--s3)}}
@media(min-width:768px){.grid{grid-template-columns:repeat(5,minmax(0,1fr));gap:var(--s4) var(--s4);padding:0 var(--s5)}}
@media(min-width:1024px){.grid{grid-template-columns:repeat(6,minmax(0,1fr))}}
@media(min-width:1280px){.grid{grid-template-columns:repeat(7,minmax(0,1fr))}}

.card{
  position:relative;display:block;border:0;padding:0;background:none;
  font-family:inherit;color:inherit;cursor:pointer;text-align:left;
  border-radius:var(--r-m);transition:transform .22s var(--ease);
  -webkit-tap-highlight-color:transparent;
}
.poster{
  position:relative;aspect-ratio:7/10;border-radius:var(--r-m);overflow:hidden;
  background:linear-gradient(160deg,#1a1a24,#101017);
  outline:1px solid var(--line-soft);outline-offset:-1px;
  transition:outline-color .22s var(--ease),box-shadow .22s var(--ease);
}
.poster img{width:100%;height:100%;object-fit:cover;display:block;opacity:0;transition:opacity .4s var(--ease)}
.poster img.on{opacity:1}
.poster .ph{
  position:absolute;inset:0;display:none;flex-direction:column;align-items:center;justify-content:center;
  gap:5px;padding:var(--s2);background:linear-gradient(150deg,#20202c,#12121a 70%);
}
.poster .ph span{font-size:1.45rem;font-weight:800;color:rgba(255,255,255,.16);letter-spacing:-.03em}
.poster .ph small{font-size:.58rem;color:rgba(255,255,255,.2);letter-spacing:.06em;text-align:center}
.poster.fail img{display:none}
.poster.fail .ph{display:flex}

.rank{
  position:absolute;top:5px;left:7px;z-index:2;
  font-size:clamp(.92rem,2.8vw,1.3rem);font-weight:800;line-height:1;
  letter-spacing:-.03em;font-variant-numeric:tabular-nums;color:rgba(255,255,255,.92);
  text-shadow:0 1px 6px rgba(0,0,0,.85),0 0 18px rgba(0,0,0,.6);
}
.rank.top{color:var(--accent);text-shadow:0 1px 8px rgba(0,0,0,.9),0 0 14px rgba(255,90,122,.45)}
.rank.no1{color:var(--gold);text-shadow:0 1px 8px rgba(0,0,0,.9),0 0 16px rgba(255,182,72,.5)}
.badge{
  position:absolute;top:6px;right:6px;z-index:2;padding:1px 5px;border-radius:4px;
  font-size:.58rem;font-weight:700;letter-spacing:.03em;
  background:rgba(255,90,122,.92);color:#fff;backdrop-filter:blur(4px);
}
.cap{
  position:absolute;left:0;right:0;bottom:0;z-index:2;padding:24px 8px 7px;
  background:linear-gradient(to top,rgba(4,4,8,.95) 0%,rgba(4,4,8,.66) 46%,transparent 100%);
}
.cap h3{
  font-size:clamp(.75rem,2.4vw,.85rem);font-weight:600;line-height:1.32;letter-spacing:-.01em;
  display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;
  text-shadow:0 1px 3px rgba(0,0,0,.7);
}
.cap .mf{
  margin-top:3px;font-size:clamp(.6rem,1.9vw,.68rem);line-height:1.42;color:var(--muted);
  font-variant-numeric:tabular-nums;
  display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;
}
.cap .mf b{color:var(--accent);font-weight:700}
.cap .mf b.zero{color:var(--muted);font-weight:600}
.cap .mf .sep{opacity:.4;margin:0 3px}

@media(hover:hover) and (pointer:fine){
  .card:hover{transform:translateY(-4px)}
  .card:hover .poster{outline-color:var(--accent);box-shadow:0 14px 30px -12px rgba(0,0,0,.8),0 0 0 1px rgba(255,90,122,.35)}
  .card:hover .cap h3{color:#fff}
}
.card:active{transform:scale(.985)}

/* ================= 加载更多 / 空态 ================= */
.more-wrap{display:flex;justify-content:center;padding:var(--s5) var(--s4) 0}
.more{
  height:40px;padding:0 var(--s5);border-radius:999px;
  background:var(--surface);border:1px solid var(--line);color:var(--text);
  font-size:.82rem;font-weight:600;font-family:inherit;cursor:pointer;
  font-variant-numeric:tabular-nums;transition:all .18s var(--ease);
}
.more:hover{border-color:var(--accent);color:var(--accent);background:var(--accent-soft)}
.more[hidden]{display:none}
.empty{grid-column:1/-1;text-align:center;padding:var(--s7) var(--s4);color:var(--muted)}
.empty p{font-size:.9rem;margin-bottom:var(--s4)}
.empty button{
  height:36px;padding:0 var(--s4);border-radius:999px;background:transparent;
  border:1px solid var(--accent);color:var(--accent);
  font-family:inherit;font-size:.8rem;font-weight:600;cursor:pointer;
}
.empty button:hover{background:var(--accent-soft)}

/* ================= 详情抽屉 ================= */
.scrim{
  position:fixed;inset:0;z-index:60;background:rgba(4,4,8,.66);
  backdrop-filter:blur(3px);opacity:0;pointer-events:none;transition:opacity .24s var(--ease);
}
.scrim.on{opacity:1;pointer-events:auto}
.sheet{
  position:fixed;z-index:61;background:var(--bg-2);display:flex;flex-direction:column;
  left:0;right:0;bottom:0;max-height:84vh;
  border-radius:var(--r-l) var(--r-l) 0 0;border-top:1px solid var(--line);
  transform:translateY(102%);transition:transform .3s var(--ease);
  padding-bottom:env(safe-area-inset-bottom);
  box-shadow:0 -20px 60px -20px rgba(0,0,0,.9);
}
.sheet.on{transform:translateY(0)}
@media(min-width:768px){
  .sheet{
    left:auto;top:0;bottom:0;right:0;width:420px;max-height:none;
    border-radius:0;border-top:0;border-left:1px solid var(--line);
    transform:translateX(102%);box-shadow:-30px 0 80px -30px rgba(0,0,0,.95);
  }
  .sheet.on{transform:translateX(0)}
}
.sheet-grip{width:36px;height:3px;border-radius:2px;background:#3a3a46;margin:var(--s2) auto var(--s1);flex:0 0 auto}
@media(min-width:768px){.sheet-grip{display:none}}
.sheet-scroll{overflow-y:auto;overscroll-behavior:contain;padding:var(--s3) var(--s4) var(--s6)}
@media(min-width:768px){.sheet-scroll{padding:var(--s5) var(--s5) var(--s6)}}
.sheet-close{
  position:absolute;top:var(--s3);right:var(--s3);z-index:2;
  width:32px;height:32px;border-radius:50%;display:grid;place-items:center;
  background:rgba(255,255,255,.07);border:0;color:var(--text);cursor:pointer;
  transition:background .16s var(--ease);
}
.sheet-close:hover{background:rgba(255,255,255,.14)}
.sheet-close svg{width:15px;height:15px}
.d-hero{display:flex;gap:var(--s4);margin-bottom:var(--s4)}
.d-cover{
  width:104px;flex:0 0 auto;aspect-ratio:7/10;border-radius:var(--r-s);object-fit:cover;
  background:linear-gradient(150deg,#1c1c26,#111119);border:1px solid var(--line);
}
.d-cover.ph{display:flex;align-items:center;justify-content:center;font-weight:800;font-size:1.6rem;color:rgba(255,255,255,.2)}
.d-head{min-width:0;flex:1;padding-right:var(--s5)}
.d-head h2{font-size:1.04rem;font-weight:800;line-height:1.32;letter-spacing:-.02em;margin-bottom:var(--s2)}
.d-rankline{
  display:flex;align-items:center;gap:var(--s2);flex-wrap:wrap;
  font-size:.7rem;color:var(--muted);margin-bottom:var(--s2);font-variant-numeric:tabular-nums;
}
.d-rankline b{color:var(--accent);font-weight:800;font-size:.78rem}
.d-tags{display:flex;flex-wrap:wrap;gap:5px;margin-top:var(--s2)}
.d-tag{padding:2px 7px;border-radius:5px;font-size:.65rem;font-weight:600;background:var(--surface-2);color:var(--text-2);border:1px solid var(--line-soft)}
.d-tag.hot{background:var(--accent-soft);border-color:rgba(255,90,122,.4);color:var(--accent)}
.d-stats{
  display:grid;grid-template-columns:repeat(3,1fr);gap:1px;background:var(--line-soft);
  border:1px solid var(--line-soft);border-radius:var(--r-s);overflow:hidden;margin-bottom:var(--s4);
}
.d-stat{background:var(--surface);padding:var(--s3) var(--s2);text-align:center}
.d-stat b{display:block;font-size:.92rem;font-weight:800;letter-spacing:-.02em;font-variant-numeric:tabular-nums;color:var(--text)}
.d-stat span{font-size:.62rem;color:var(--muted);letter-spacing:.05em}
.d-sec{margin-bottom:var(--s4)}
.d-sec h4{font-size:.64rem;font-weight:700;letter-spacing:.14em;color:var(--muted);margin-bottom:var(--s2);text-transform:uppercase}
.d-rows{display:flex;flex-direction:column;gap:7px}
.d-row{display:flex;gap:var(--s3);font-size:.78rem}
.d-row dt{color:var(--muted);flex:0 0 66px}
.d-row dd{color:var(--text-2);min-width:0;word-break:break-word;font-variant-numeric:tabular-nums}
.d-sec p{font-size:.82rem;line-height:1.72;color:var(--text-2);white-space:pre-wrap;word-break:break-word}
.d-acts{display:flex;gap:var(--s2)}
.d-copy{
  flex:1;height:40px;border-radius:var(--r-s);background:var(--surface-2);border:1px solid var(--line);
  color:var(--text);font-family:inherit;font-size:.79rem;font-weight:600;cursor:pointer;
  display:flex;align-items:center;justify-content:center;gap:var(--s2);
  transition:all .16s var(--ease);
}
.d-copy:hover{border-color:var(--accent);color:var(--accent);background:var(--accent-soft)}
.d-copy svg{width:14px;height:14px}

/* ================= 页脚 ================= */
footer{
  max-width:1440px;margin:0 auto;padding:var(--s5) var(--s4) var(--s6);
  border-top:1px solid var(--line-soft);color:var(--muted);font-size:.72rem;line-height:1.85;
}
@media(min-width:768px){footer{padding:var(--s5) var(--s5) var(--s6)}}
footer b{color:var(--text-2);font-weight:600}
footer .fnote{margin-top:var(--s2);opacity:.82}
footer code{
  font-family:ui-monospace,SFMono-Regular,Menlo,monospace;font-size:.68rem;
  background:var(--surface-2);padding:1px 5px;border-radius:4px;color:var(--text-2);
}
@media(prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}
/* ================= 骨架屏（服务端模式） ================= */
.sk .sk-p{
  aspect-ratio:7/10;border-radius:var(--r-m);
  background:linear-gradient(100deg,#14141c 20%,#1e1e29 40%,#14141c 60%);
  background-size:220% 100%;
  animation:skwave 1.3s ease-in-out infinite;
}
@keyframes skwave{to{background-position:-220% 0}}
@media(prefers-reduced-motion:reduce){.sk .sk-p{animation:none}}
</style>
</head>
<body>

<header class="top">
  <div class="top-in">
    <div class="brand">
      <h1>HiTwo <em>短剧榜</em></h1>
      <span class="stamp" id="stamp"></span>
    </div>
    <div class="search">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round">
        <circle cx="11" cy="11" r="7"></circle><path d="M20 20l-4.2-4.2"></path>
      </svg>
      <input id="q" type="search" placeholder="搜剧名 / 出品方 / 题材" autocomplete="off" aria-label="搜索短剧">
    </div>
    <nav class="tabs-main" id="tabsMain" role="tablist" aria-label="主分类">
      <button class="tab" role="tab" data-tab="hot" aria-selected="true">热门<i id="cHot"></i></button>
      <button class="tab" role="tab" data-tab="new" aria-selected="false">新剧<i id="cNew"></i></button>
      <button class="tab" role="tab" data-tab="upd" aria-selected="false">更新<i id="cUpd"></i></button>
      <button class="tab" role="tab" data-tab="rank" aria-selected="false">榜单<i id="cRank"></i></button>
      <button class="tab" role="tab" data-tab="store" aria-selected="false">书城<i id="cStore"></i></button>
    </nav>
  </div>
</header>

<section class="subbar" id="subbar" hidden>
  <div class="subbar-in"></div>
</section>

<div class="bar" id="bar">
  <div class="bar-head">
    <span class="bar-title">题材</span>
    <span class="count" id="count"></span>
  </div>
  <div class="chips" id="chips"></div>
</div>

<main>
  <div class="grid" id="grid"></div>
  <div class="more-wrap"><button class="more" id="more" hidden></button></div>
</main>

<footer>
  <b>HiTwo 短剧榜</b> · 热门/详情快照 <span id="stamp2"></span> · 更新数据截至 <span id="stamp3"></span>
  <div class="fnote">
    数据来源 api.starry.wang 公开榜单接口。黑马榜口径：上架 <span id="fDarkAge"></span> 天且热度进入全站前 <span id="fDarkPct"></span>%，按日均热度排序。
    更新榜口径：近 <span id="fUpdWin"></span> 天有新集上线的剧。
    书城口径：推荐 = 按热度，最新 = 按上架时间倒序，筛选按官方标签（<span id="fNovelTagN"></span> 个）。
    单文件快照，离线可读；封面走 CDN 实时加载。
  </div>
  <div class="fnote" id="refreshNote"></div>
  <div class="fnote" id="modeNote"></div>
</footer>

<div class="toast" id="liveTip"></div>

<div class="scrim" id="scrim"></div>
<aside class="sheet" id="sheet" role="dialog" aria-modal="true" aria-label="剧集详情">
  <div class="sheet-grip"></div>
  <button class="sheet-close" id="close" aria-label="关闭">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round">
      <path d="M5 5l14 14M19 5L5 19"></path>
    </svg>
  </button>
  <div class="sheet-scroll" id="sheetBody"></div>
</aside>

<script>
(function(){
  "use strict";
  var PAYLOAD = null;
  var META = {}, BASE = '', D = [], CATS = [], N = [], NTAGS = [];
  var COUNTS = {}, GIFT_ORDER = [], DARK = {minAge:7, maxAge:45, topPct:20, threshold:0};
  var giftIdx = {};
  var PAGE = 96;
  var POLL_MS = (function(){
    var m = location.search.match(/[?&]poll=(\d+)/);
    return m ? Math.max(1000, parseInt(m[1], 10)) : 60000;   // 服务器模式检查 data.json 的间隔，可用 ?poll=30000 覆盖
  })();
  var LIVE = false;             // 是否已连上数据源
  var MODE = 'server';          // 服务端 API 模式（PM2）

  function bindData(p){
    if(!p || !p.meta) return false;
    PAYLOAD = p;
    META = p.meta || {};
    BASE = META.coverBase || '';
    D = p.dramas || [];
    CATS = p.categories || [];
    N = p.novels || [];
    NTAGS = p.novelTags || [];
    COUNTS = META.counts || {};
    GIFT_ORDER = META.giftOrder || [];
    DARK = META.dark || {minAge:7, maxAge:45, topPct:20, threshold:0};
    giftIdx = {};
    GIFT_ORDER.forEach(function(id,i){ giftIdx[id] = i });
    return true;
  }

  var state = { tab:'hot', sub:'finish', cat:'全部', q:'', shown:PAGE, list:[] };

  var $grid = document.getElementById('grid');
  var $chips = document.getElementById('chips');
  var $bar = document.getElementById('bar');
  var $subbar = document.getElementById('subbar');
  var $rule = document.getElementById('rule');
  var $count = document.getElementById('count');
  var $more = document.getElementById('more');
  var $q = document.getElementById('q');
  var $scrim = document.getElementById('scrim');
  var $sheet = document.getElementById('sheet');
  var $sheetBody = document.getElementById('sheetBody');
  var $close = document.getElementById('close');

  /* ================= 工具 ================= */
  function fmtN(n){
    if(n==null) return '—';
    n = Number(n) || 0;
    if(n >= 100000000) return (n/100000000).toFixed(1).replace(/\.0$/,'') + '亿';
    if(n >= 10000) return (n/10000).toFixed(n>=100000?0:1).replace(/\.0$/,'') + '万';
    return String(n).replace(/\B(?=(\d{3})+(?!\d))/g, ',');
  }
  function esc(s){
    return String(s==null?'':s).replace(/[&<>"']/g,function(c){
      return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c];
    });
  }
  function ageText(d){
    if(d==null) return '';
    if(d<=0) return '今天上架';
    if(d===1) return '昨天上架';
    return d+' 天前上架';
  }
  function updText(d){
    if(d.ld==null) return '';
    var n = d.r7 || 0;
    if(d.ld<=0) return '今天更 '+n+' 集';
    if(d.ld===1) return '昨天更 '+n+' 集';
    if(d.ld<=7) return d.ld+' 天前更 '+n+' 集';
    return d.ld+' 天前更新';
  }
  function stampText(iso){
    if(!iso) return '—';
    var t = new Date(iso);
    if(isNaN(t.getTime())) return iso;
    var p=function(x){return String(x).padStart(2,'0')};
    return t.getFullYear()+'-'+p(t.getMonth()+1)+'-'+p(t.getDate())+' '+p(t.getHours())+':'+p(t.getMinutes());
  }
  /* ================= 每类卡片副行 ================= */
  function heatText(h){
    return (h>0) ? '<b>'+fmtN(h)+'</b>' : '<b class="zero">暂无热度</b>';
  }
  function metaHTML(d, ctx){
    var H = function(v){ return '<b>'+fmtN(v)+'</b>' };
    var S = '<span class="sep">·</span>';
    switch(ctx){
      case 'hot':    return heatText(d.h) + ' 热度';
      case 'new':    return heatText(d.h) + S + ageText(d.ad);
      case 'upd':    return '<b>'+ (d.pc||0) +'/'+ (d.e||0) +'</b> 集' + S + updText(d);
      case 'finish': return heatText(d.h) + S + '全 ' + (d.e||0) + ' 集';
      case 'dark':   return '<b>'+ fmtN(Math.round((d.h||0)/Math.max(d.ad||1,1))) +'</b> 日均' + S + '上架 ' + d.ad + ' 天';
      case 'gift':   return '<b>礼物 ' + fmtN(d.gq||0) + '</b>' + S + heatText(d.h) + ' 热度';
      case 'rec':    return heatText(d.h) + ' 热度' + S + (d.ch||0) + ' 章';
      case 'late':   return heatText(d.h) + ' 热度' + S + ageText(d.ad);
      default:       return heatText(d.h) + ' 热度';
    }
  }

  /* ================= 数据筛选与排序 ================= */
  function isStore(){ return state.tab === 'store' }
  function inScope(d){
    if(isStore()) return true;
    if(state.tab==='upd' && !(d.r7 > 0)) return false;
    if(state.tab==='rank'){
      if(state.sub==='finish' && d.s !== 0) return false;
      if(state.sub==='dark'){
        if(d.ad==null || d.ad < DARK.minAge || d.ad > DARK.maxAge) return false;
        if((d.h||0) < (DARK.threshold||0)) return false;
      }
      if(state.sub==='gift' && !(d.i in giftIdx)) return false;
    }
    return true;
  }
  function matchCat(d){
    if(state.cat==='全部') return true;
    if(isStore()) return (d.g||[]).indexOf(state.cat) > -1;
    return (d.k === state.cat) || (d.g && d.g.indexOf(state.cat) > -1);
  }
  function matchQ(d){
    if(!state.q) return true;
    var q = state.q.toLowerCase();
    var hay = ((d.t||'')+' '+(d.a||'')+' '+((d.g||[]).join(' '))).toLowerCase();
    return hay.indexOf(q) > -1;
  }
  function ctx(){
    return (state.tab==='rank' || isStore()) ? state.sub : state.tab;
  }
  function sortList(list){
    var c = ctx();
    if(c==='new' || c==='late'){
      list.sort(function(a,b){ return (b.ct||'').localeCompare(a.ct||'') || (b.h||0)-(a.h||0) });
    }else if(c==='upd'){
      list.sort(function(a,b){
        return (b.le||'').localeCompare(a.le||'') || (b.r7||0)-(a.r7||0) || (b.h||0)-(a.h||0);
      });
    }else if(c==='dark'){
      list.sort(function(a,b){
        return (b.h/Math.max(b.ad||1,1)) - (a.h/Math.max(a.ad||1,1));
      });
    }else if(c==='gift'){
      list.sort(function(a,b){ return (giftIdx[a.i]||0)-(giftIdx[b.i]||0) });
    }else{
      list.sort(function(a,b){ return (b.h||0)-(a.h||0) });
    }
    return list;
  }
  function currentList(){
    var src = isStore() ? N : D;
    var list = src.filter(function(d){ return inScope(d) && matchCat(d) && matchQ(d) });
    return sortList(list);
  }

  /* ================= 渲染 ================= */
  function cardHTML(d, idx){
    var rk = idx <= 3 ? (idx === 1 ? 'rank no1' : 'rank top') : 'rank';
    var badge = d.b ? '<span class="badge">'+esc(d.b)+'</span>' : '';
    return '<button class="card" data-id="'+d.i+'" title="'+esc(d.t)+'">'+
      '<div class="poster">'+
        '<img src="'+esc(BASE + (d.c||''))+'" alt="'+esc(d.t)+' 封面" loading="lazy" decoding="async" '+
          'onload="this.classList.add(\'on\')" '+
          'onerror="this.removeAttribute(\'onload\');this.parentNode.classList.add(\'fail\')">'+
        '<div class="ph"><span>'+esc((d.t||'?').slice(0,1))+'</span><small>封面加载失败</small></div>'+
        '<span class="'+rk+'">'+(idx+1)+'</span>'+
        badge +
        '<div class="cap"><h3>'+esc(d.t)+'</h3><div class="mf">'+metaHTML(d, ctx())+'</div></div>'+
      '</div>'+
    '</button>';
  }

  function renderGrid(reset){
    var list = currentList();
    state.list = list;
    var slice = list.slice(0, state.shown);
    if(reset){
      if(!list.length){
        $grid.innerHTML = '<div class="empty"><p>这个分类下没有符合条件的剧，换个关键词或题材试试</p>'+
          '<button id="resetAll">清空筛选</button></div>';
        $more.hidden = true;
        updateCount(0);
        return;
      }
      $grid.innerHTML = slice.map(cardHTML).join('');
    }else{
      var start = $grid.querySelectorAll('.card').length;
      $grid.insertAdjacentHTML('beforeend', list.slice(start, state.shown).map(function(d,i){ return cardHTML(d, start+i) }).join(''));
    }
    updateCount(list.length);
    var left = list.length - state.shown;
    if(left > 0){ $more.hidden=false; $more.textContent='加载更多 · 还剩 '+left+' 部' }
    else $more.hidden = true;
    warmCached();
  }

  var SUBTABS = {
    rank: [
      {k:'finish', label:'完结榜', count:'finish', rule:'已完结的剧，按全站热度'},
      {k:'dark',   label:'黑马榜', count:'dark',   rule:'上架 '+DARK.minAge+'–'+DARK.maxAge+' 天 · 热度前 '+(DARK.topPct||20)+'% · 按日均热度'},
      {k:'gift',   label:'礼物榜', count:'gift',   rule:'官方礼物榜顺序 · 共 '+GIFT_ORDER.length+' 部'}
    ],
    store: [
      {k:'rec',  label:'推荐', count:'novel', rule:'按热度推荐'},
      {k:'late', label:'最新', count:'novel', rule:'按上架时间倒序'}
    ]
  };

  function updateCount(n){
    var base = '', unit = '部';
    if(isStore()){
      unit = '本';
      base = state.sub==='late' ? '最新上架' : '编辑推荐';
    }
    else if(state.tab==='upd') base = '近 '+META.updWindow+' 天有更新';
    else if(state.tab==='new') base = '近 7 天上架 '+(COUNTS.new7||0)+' 部 · 按上线时间倒序';
    else if(state.tab==='rank' && state.sub==='finish') base = '已完结 · 按热度';
    else if(state.tab==='rank' && state.sub==='dark') base = '黑马 · 按日均热度';
    else if(state.tab==='rank' && state.sub==='gift') base = '礼物 · 官方顺序';
    else base = '按热度';
    $count.innerHTML = base + ' · 共 <b>'+n+'</b> '+unit;
  }

  /* ================= 导航与筛选 UI ================= */
  var SUBTABS = {
    rank: [
      {k:'finish', label:'完结榜', count:'finish', rule:'已完结的剧，按全站热度'},
      {k:'dark',   label:'黑马榜', count:'dark',   rule:'上架 '+DARK.minAge+'–'+DARK.maxAge+' 天 · 热度前 '+(DARK.topPct||20)+'% · 按日均热度'},
      {k:'gift',   label:'礼物榜', count:'gift',   rule:'官方礼物榜顺序 · 共 '+GIFT_ORDER.length+' 部'}
    ],
    store: [
      {k:'rec',  label:'推荐', count:'novel', rule:'按热度推荐'},
      {k:'late', label:'最新', count:'novel', rule:'按上架时间倒序'}
    ]
  };
  function paintTabs(){
    Array.prototype.forEach.call(document.querySelectorAll('.tabs-main .tab'), function(t){
      t.setAttribute('aria-selected', String(t.dataset.tab === state.tab));
    });
    document.getElementById('cHot').textContent = COUNTS.all || D.length;
    document.getElementById('cNew').textContent = COUNTS.all || D.length;
    document.getElementById('cUpd').textContent = COUNTS.upd || '';
    document.getElementById('cRank').textContent = COUNTS.finish || '';
    document.getElementById('cStore').textContent = COUNTS.novel || N.length;
  }
  var INFO_ICON = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="12" cy="12" r="9"></circle><path d="M12 11v5M12 8v.01"></path></svg>';
  function paintSub(){
    var mode = state.tab==='rank' ? 'rank' : (isStore() ? 'store' : null);
    $subbar.hidden = !mode;
    if(!mode) return;
    var defs = SUBTABS[mode], ok = false, i;
    for(i=0;i<defs.length;i++) if(defs[i].k === state.sub) ok = true;
    if(!ok) state.sub = defs[0].k;
    var box = $subbar.querySelector('.subbar-in');
    if(box.dataset.mode !== mode){
      var html = defs.map(function(d){
        return '<button class="subtab" data-sub="'+d.k+'" aria-pressed="'+(state.sub===d.k)+'">'+
               d.label+'<i>'+(COUNTS[d.count]||0)+'</i></button>';
      }).join('');
      html += '<span class="rule"></span>';
      box.innerHTML = html;
      box.dataset.mode = mode;
    }
    var cur = null;
    for(i=0;i<defs.length;i++) if(defs[i].k === state.sub) cur = defs[i];
    Array.prototype.forEach.call(box.querySelectorAll('.subtab'), function(t){
      t.setAttribute('aria-pressed', String(t.dataset.sub === state.sub));
    });
    var r = box.querySelector('.rule');
    if(r) r.innerHTML = INFO_ICON + esc(cur ? cur.rule : '');
  }
  function chipSource(){
    return isStore()
      ? [{name:'全部', n:N.length}].concat(NTAGS)
      : [{name:'全部', n:D.length}].concat(CATS);
  }
  function buildChips(){
    var cats = chipSource(), exists = false, i;
    for(i=0;i<cats.length;i++) if(cats[i].name === state.cat) exists = true;
    if(!exists) state.cat = '全部';
    $chips.innerHTML = cats.map(function(c){
      return '<button class="chip" data-cat="'+esc(c.name)+'" aria-pressed="'+(state.cat===c.name)+'">'+
        esc(c.name)+'<i>'+c.n+'</i></button>';
    }).join('');
  }
  function paintBar(){
    $bar.hidden = (state.tab === 'rank');
  }

  /* ================= 详情 ================= */
  var lastFocus = null;
  function openDetail(id){
    var d = null;
    for(var i=0;i<D.length;i++){ if(String(D[i].i) === String(id)){ d = D[i]; break } }
    if(!d) return;
    lastFocus = document.activeElement;
    var rank = (state.list||[]).findIndex(function(x){ return String(x.i)===String(id) })+1;
    var tags = (d.g||[]).map(function(t){
      return '<span class="d-tag'+(t===d.k?' hot':'')+'">'+esc(t)+'</span>';
    }).join('');
    var cover = d.c
      ? '<img class="d-cover" src="'+esc(BASE+d.c)+'" alt="'+esc(d.t)+' 封面" loading="eager">'
      : '<div class="d-cover ph">'+esc((d.t||'?').slice(0,1))+'</div>';
    var mode = d.mo==='PER_EPISODE' ? '单集解锁' : (d.mo==='WHOLE' ? '整部解锁' : '—');
    var price = (d.wp||0) > 0 ? (d.wp+' 金币') : (d.wp===0 ? '免费' : '—');
    var stat3 = '<div class="d-stat"><b>'+fmtN(d.h)+'</b><span>热度</span></div>';
    var rowExtra = '';
    if(d.ad!=null) rowExtra += '<div class="d-row"><dt>上架</dt><dd>'+esc(d.ct||'—')+' · '+d.ad+' 天前</dd></div>';
    if(d.le) rowExtra += '<div class="d-row"><dt>最后更新</dt><dd>'+esc(d.le)+' · '+(d.ld===0?'今天':d.ld+' 天前')+' · 已发 '+(d.pc||0)+'/'+(d.e||0)+' 集</dd></div>';
    if(d.gq!=null) rowExtra += '<div class="d-row"><dt>礼物</dt><dd>'+fmtN(d.gq)+' 件</dd></div>';

    $sheetBody.innerHTML =
      '<div class="d-hero">'+cover+
        '<div class="d-head">'+
          '<div class="d-rankline">'+
            (rank>0?'<b>NO.'+rank+'</b><span>·</span>':'')+
            '<span>'+esc(d.k||'')+'</span><span>·</span>'+
            (d.s?'<span>连载中</span>':'<span>已完结</span>')+
          '</div>'+
          '<h2>'+esc(d.t)+'</h2>'+
          '<div class="d-tags">'+tags+'</div>'+
        '</div>'+
      '</div>'+
      '<div class="d-stats">'+
        '<div class="d-stat"><b>'+fmtN(d.e)+'</b><span>总集数</span></div>'+
        '<div class="d-stat"><b>'+fmtN(d.fp)+'</b><span>免费集</span></div>'+
        stat3+
      '</div>'+
      '<div class="d-sec"><h4>数据</h4><dl class="d-rows">'+
        '<div class="d-row"><dt>播放量</dt><dd>'+fmtN(d.v)+'</dd></div>'+
        '<div class="d-row"><dt>出品方</dt><dd>'+esc(d.a||'—')+'</dd></div>'+
        rowExtra+
        '<div class="d-row"><dt>解锁方式</dt><dd>'+mode+' · '+price+'</dd></div>'+
        '<div class="d-row"><dt>剧集 ID</dt><dd>'+esc(d.i)+'</dd></div>'+
      '</dl></div>'+
      (d.sd ? '<div class="d-sec"><h4>简介</h4><p>'+esc(d.sd)+(d.sd.length>=120?'…':'')+'</p></div>' : '')+
      '<div class="d-acts"><button class="d-copy" id="copyBtn">'+
        '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">'+
        '<rect x="9" y="9" width="11" height="11" rx="2"></rect><path d="M5 15V5a2 2 0 012-2h10"></path></svg>'+
        '复制剧名</button></div>';

    $scrim.classList.add('on'); $sheet.classList.add('on');
    document.body.style.overflow='hidden'; $close.focus();
    bindCopy(d.t);
  }

  /* 书城详情 */
  function openNovel(id){
    var d = null;
    for(var i=0;i<N.length;i++){ if(String(N[i].i) === String(id)){ d = N[i]; break } }
    if(!d) return;
    lastFocus = document.activeElement;
    var rank = (state.list||[]).findIndex(function(x){ return String(x.i)===String(id) })+1;
    var tags = (d.g||[]).map(function(t){ return '<span class="d-tag">'+esc(t)+'</span>' }).join('');
    var cover = d.c
      ? '<img class="d-cover" src="'+esc(BASE+d.c)+'" alt="'+esc(d.t)+' 封面" loading="eager">'
      : '<div class="d-cover ph">'+esc((d.t||'?').slice(0,1))+'</div>';
    var price = (d.wp||0) > 0 ? (d.wp+' 金币') : '免费';
    var rows = '';
    rows += '<div class="d-row"><dt>出品方</dt><dd>'+esc(d.a||'—')+'</dd></div>';
    rows += '<div class="d-row"><dt>阅读量</dt><dd>'+fmtN(d.v)+'</dd></div>';
    rows += '<div class="d-row"><dt>解锁数</dt><dd>'+fmtN(d.u)+'</dd></div>';
    rows += '<div class="d-row"><dt>上架</dt><dd>'+esc(d.ct||'—')+(d.ad!=null?' · '+d.ad+' 天前':'')+'</dd></div>';
    if(d.lu) rows += '<div class="d-row"><dt>最近更新</dt><dd>'+esc(d.lu)+'</dd></div>';
    rows += '<div class="d-row"><dt>解锁方式</dt><dd>按章解锁 · '+price+'</dd></div>';
    rows += '<div class="d-row"><dt>作品 ID</dt><dd>'+esc(d.i)+'</dd></div>';

    $sheetBody.innerHTML =
      '<div class="d-hero">'+cover+
        '<div class="d-head">'+
          '<div class="d-rankline">'+
            (rank>0?'<b>NO.'+rank+'</b><span>·</span>':'')+
            '<span>小说</span><span>·</span>'+
            (d.s?'<span>连载中</span>':'<span>已完结</span>')+
          '</div>'+
          '<h2>'+esc(d.t)+'</h2>'+
          '<div class="d-tags">'+tags+'</div>'+
        '</div>'+
      '</div>'+
      '<div class="d-stats">'+
        '<div class="d-stat"><b>'+fmtN(d.ch)+'</b><span>章节</span></div>'+
        '<div class="d-stat"><b>'+((d.h>0)?fmtN(d.h):'—')+'</b><span>热度</span></div>'+
        '<div class="d-stat"><b>'+fmtN(d.v)+'</b><span>阅读</span></div>'+
      '</div>'+
      '<div class="d-sec"><h4>作品数据</h4><dl class="d-rows">'+rows+'</dl></div>'+
      (d.sd ? '<div class="d-sec"><h4>简介</h4><p>'+esc(d.sd)+(d.sd.length>=120?'…':'')+'</p></div>' : '')+
      '<div class="d-acts"><button class="d-copy" id="copyBtn">'+
        '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">'+
        '<rect x="9" y="9" width="11" height="11" rx="2"></rect><path d="M5 15V5a2 2 0 012-2h10"></path></svg>'+
        '复制书名</button></div>';

    $scrim.classList.add('on'); $sheet.classList.add('on');
    document.body.style.overflow='hidden'; $close.focus();
    bindCopy(d.t);
  }

  function bindCopy(text){
    var cb = document.getElementById('copyBtn');
    if(!cb) return;
    var label = cb.innerHTML;
    cb.addEventListener('click', function(){
      var txt = text || '';
      var done = function(){ cb.textContent='已复制 ✓'; setTimeout(function(){ cb.innerHTML = label }, 1400) };
      if(navigator.clipboard && navigator.clipboard.writeText) navigator.clipboard.writeText(txt).then(done, done);
      else{
        var ta=document.createElement('textarea'); ta.value=txt; document.body.appendChild(ta); ta.select();
        try{ document.execCommand('copy') }catch(e){}
        document.body.removeChild(ta); done();
      }
    });
  }
  function closeDetail(){
    $scrim.classList.remove('on'); $sheet.classList.remove('on');
    document.body.style.overflow='';
    if(lastFocus && lastFocus.focus) lastFocus.focus();
  }

  /* ================= 图片缓存态 ================= */
  function warmCached(){
    Array.prototype.forEach.call(document.querySelectorAll('.poster img'), function(img){
      if(img.complete && img.naturalWidth > 0) img.classList.add('on');
      else if(img.complete && img.naturalWidth === 0) img.parentNode.classList.add('fail');
    });
  }
  document.addEventListener('load', function(e){
    if(e.target.tagName === 'IMG') e.target.classList.add('on');
  }, true);
  document.addEventListener('error', function(e){
    if(e.target.tagName !== 'IMG') return;
    var host = e.target.closest('.poster');
    if(host) host.classList.add('fail');
  }, true);

  /* ================= 事件 ================= */
  $grid.addEventListener('click', function(e){
    var card = e.target.closest('.card');
    if(card){
      if(isStore()) openNovel(card.dataset.id);
      else openDetail(card.dataset.id);
      return;
    }
    if(e.target.id === 'resetAll'){
      state.cat='全部'; state.q=''; $q.value='';
      buildChips(); sync();
    }
  });
  $chips.addEventListener('click', function(e){
    var c = e.target.closest('.chip');
    if(!c) return;
    state.cat = c.dataset.cat;
    Array.prototype.forEach.call($chips.children, function(el){
      el.setAttribute('aria-pressed', String(el.dataset.cat === state.cat));
    });
    state.shown = PAGE; renderGrid(true); writeHash();
  });
  document.getElementById('tabsMain').addEventListener('click', function(e){
    var t = e.target.closest('.tab');
    if(!t) return;
    if(t.dataset.tab !== state.tab) state.cat = '全部';
    state.tab = t.dataset.tab;
    state.shown = PAGE;
    sync();
  });
  $subbar.addEventListener('click', function(e){
    var t = e.target.closest('.subtab');
    if(!t) return;
    state.sub = t.dataset.sub;
    state.shown = PAGE;
    sync();
  });
  var tq = null;
  $q.addEventListener('input', function(){
    clearTimeout(tq);
    tq = setTimeout(function(){ state.q = $q.value.trim(); state.shown = PAGE; sync(); }, 130);
  });
  $more.addEventListener('click', function(){ state.shown += PAGE; renderGrid(false) });
  $close.addEventListener('click', closeDetail);
  $scrim.addEventListener('click', closeDetail);
  document.addEventListener('keydown', function(e){ if(e.key === 'Escape') closeDetail() });

  /* ================= hash 深链 ================= */
  function writeHash(){
    var h = '#tab='+state.tab;
    if(state.tab==='rank' || isStore()) h += '&sub='+state.sub;
    if(state.cat!=='全部') h += '&cat='+encodeURIComponent(state.cat);
    if(state.q) h += '&q='+encodeURIComponent(state.q);
    try{ history.replaceState(null,'',h) }catch(e){}
  }
  function readHash(){
    var out = {tab:'hot', sub:'finish', cat:'全部', q:''};
    var h = location.hash.replace(/^#/,'');
    if(h) h.split('&').forEach(function(kv){
      var p = kv.split('='), k = p[0], v = decodeURIComponent(p[1]||'');
      if(k==='tab' && v) out.tab = v;
      if(k==='sub' && v) out.sub = v;
      if(k==='cat' && v) out.cat = v;
      if(k==='q') out.q = v;
    });
    if(['hot','new','upd','rank','store'].indexOf(out.tab) === -1) out.tab = 'hot';
    var allowed = out.tab==='store' ? ['rec','late'] : ['finish','dark','gift'];
    if(allowed.indexOf(out.sub) === -1) out.sub = out.tab==='store' ? 'rec' : 'finish';
    return out;
  }
  function applyHash(){
    var s = readHash();
    state.tab=s.tab; state.sub=s.sub; state.cat=s.cat; state.q=s.q;
    if($q.value !== s.q) $q.value = s.q;
    state.shown = PAGE;
    buildChips();
    sync();
  }
  window.addEventListener('hashchange', applyHash);

  /* ================= 总入口 ================= */
  function syncTopH(){
    var el = document.querySelector('.top');
    if(!el) return;
    var h = Math.round(el.getBoundingClientRect().height);
    if(h > 0) document.documentElement.style.setProperty('--top-h', h + 'px');
  }
  var rt = null;
  window.addEventListener('resize', function(){ clearTimeout(rt); rt = setTimeout(syncTopH, 120) });
  window.addEventListener('orientationchange', function(){ setTimeout(syncTopH, 200) });

  function sync(){
    paintTabs(); paintSub(); paintBar();
    buildChips();
    renderGrid(true);
    writeHash();
  }

  /* 初始化 */
  function relTime(iso){
    var t = new Date(iso);
    if(isNaN(t.getTime())) return '';
    var m = Math.round((Date.now() - t.getTime()) / 60000);
    if(m < 1) return '刚刚';
    if(m < 60) return m + ' 分钟前';
    var h = Math.round(m / 60);
    if(h < 24) return h + ' 小时前';
    return Math.round(h / 24) + ' 天前';
  }
  function shortStamp(iso){
    var t = new Date(iso);
    if(isNaN(t.getTime())) return String(iso || '');
    var p = function(x){ return String(x).padStart(2,'0') };
    return p(t.getMonth()+1)+'-'+p(t.getDate())+' '+p(t.getHours())+':'+p(t.getMinutes());
  }
  function paintMeta(){
    var GEN = META.generatedAt;
    var dot = '<span class="dot' + (LIVE ? ' live' : '') + '"></span>';
    document.getElementById('stamp').innerHTML =
      dot +
      '<span class="s-lbl">数据更新</span>' +
      '<span>' + esc(shortStamp(GEN)) + '</span>' +
      '<span class="s-rel">· ' + esc(relTime(GEN)) + '</span>';
    document.getElementById('stamp2').textContent = stampText(GEN) + '（' + relTime(GEN) + '）';
    document.getElementById('stamp3').textContent = META.episodesAsOf || '—';
    document.getElementById('fDarkAge').textContent = DARK.minAge+'–'+DARK.maxAge;
    document.getElementById('fDarkPct').textContent = (DARK.topPct||20);
    document.getElementById('fUpdWin').textContent = META.updWindow || 7;
    document.getElementById('fNovelTagN').textContent = NTAGS.length;
    var note = document.getElementById('modeNote');
    var rn = document.getElementById('refreshNote');
    if(MODE === 'server'){
      if(rn) rn.innerHTML = '数据由服务端每 ' + Math.round(POLL_MS/1000) + ' 秒检查一次并自动更新；刷新频繁度由服务端 <code>REFRESH_LIGHT</code> / <code>REFRESH_HEAVY</code> 控制。';
      if(note) note.innerHTML = LIVE
        ? '已连接服务端 <code>/api/data</code>，页面会自动保持最新（保留当前分类与筛选）。顶栏小圆点闪动表示在线。'
        : '正在连接服务端…';
    }else{
      if(rn) rn.innerHTML = '刷新数据：双击目录里的 <code>刷新并打开.bat</code>（约 10 秒重建并自动打开最新版）；需要同时刷新"更新"榜的分集进度时跑 <code>python build_rank_page.py</code>（约 3 分钟）。';
      if(note) note.innerHTML = LIVE
        ? '已连接同源 <code>data.json</code>，每 ' + Math.round(POLL_MS/1000) + ' 秒自动检查一次；数据一变页面自动刷新（保留当前分类与筛选）。'
        : '本页是构建时快照，不会自己联网更新（接口未开放跨域，浏览器内无法直连）。想看最新：双击 <code>刷新并打开.bat</code>，或把页面放到服务器并配套 <code>data.json</code>。';
    }
  }
  /* ================= 骨架屏 ================= */
  function skeleton(){
    var s = '';
    for(var i=0;i<21;i++) s += '<div class="sk"><div class="sk-p"></div></div>';
    return s;
  }

  /* ================= 数据装载 ================= */
  function flashTip(text){
    var el = document.getElementById('liveTip');
    if(!el) return;
    el.textContent = text;
    el.classList.add('on');
    clearTimeout(el._t);
    el._t = setTimeout(function(){ el.classList.remove('on') }, 3200);
  }
  function fetchJSON(url){
    return fetch(url, {cache:'no-store', headers:{'Accept':'application/json'}})
      .then(function(r){
        if(!r.ok) throw new Error('HTTP ' + r.status + (r.status===503 ? '（服务端还在准备数据）' : ''));
        return r.json();
      });
  }
  function applyPayload(p, first){
    if(!bindData(p)) throw new Error('数据格式异常');
    LIVE = true;
    if(first){
      paintMeta();
      applyHash();
      syncTopH();
      setTimeout(syncTopH, 260);
    }else{
      sync();
      paintMeta();
      syncTopH();
      warmCached();
    }
  }
  function bootError(msg){
    $more.hidden = true;
    $grid.innerHTML = '<div class="empty"><p>数据加载失败：' + esc(msg) + '</p>' +
      '<button id="retryBtn">重新加载</button></div>';
    var b = document.getElementById('retryBtn');
    if(b) b.addEventListener('click', function(){ boot(); });
    document.getElementById('count').textContent = '连接失败';
  }

  var booted = false, polling = false;
  function startPolling(){
    if(polling) return;
    polling = true;
    setInterval(function(){
      fetchJSON('api/version?ts=' + Date.now())
        .then(function(v){
          if(v && v.generatedAt && v.generatedAt !== META.generatedAt){
            return fetchJSON('api/data?ts=' + Date.now()).then(function(p){
              applyPayload(p, false);
              flashTip('数据已更新');
            });
          }
          paintMeta();   // 只刷新"几分钟前"这类相对时间
        })
        .catch(function(){
          if(LIVE){ LIVE = false; paintMeta(); }
        });
    }, POLL_MS);
  }

  function boot(){
    if(!booted) $grid.innerHTML = skeleton();
    fetchJSON('api/data?ts=' + Date.now())
      .then(function(p){
        applyPayload(p, !booted);
        booted = true;
        startPolling();
      })
      .catch(function(e){ bootError(e.message); });
  }

  paintMeta();
  boot();
})();
</script>
</body>
</html>
